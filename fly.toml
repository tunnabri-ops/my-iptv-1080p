app = 'my-iptv-1080p'
primary_region = 'iad'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = '15s'
  timeout = '5s'
  grace_period = '10s'
  method = 'get'
  path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
