server {
    listen 80;
    server_name localhost;

    location /live/ {
        root /app;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
